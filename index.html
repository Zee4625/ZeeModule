<!DOCTYPE html>

<head>

<div id="desk">
 <div id="home">
  <div id="hClock" class="hclock">--:--</div><div id="hDate" class="sm" style="opacity:.85"></div>
  <div class="zlogo">Z<b>.</b>Engine</div>
  <form id="hForm" class="hform" autocomplete="off"><input id="hQ" type="text" placeholder="Search the web with Z.Engine" aria-label="Search" autocomplete="off"><button class="b" type="submit">SEARCH</button></form>
  <div class="sm" style="opacity:.8;text-align:center;max-width:40rem">Real results from Wikipedia and Wikimedia, plus Google when you add a free key. Full web results open on Google, DuckDuckGo, Bing and Brave.</div>
  <div class="ttl" style="width:min(46rem,94vw)"><span>Apps</span><span id="hCount" style="color:var(--c)"></span></div>
  <div id="hApps" class="apps"></div>
  <div id="hSecret" style="display:none;width:min(46rem,94vw)"><div class="ttl"><span style="color:var(--c)">Secret apps</span><button class="b" id="hLock">LOCK</button></div><div id="hSecApps" class="apps" style="width:100%"></div></div>
 </div>
 <div id="wins"></div>
</div>

<div id="startMenu" class="smenu"></div>
