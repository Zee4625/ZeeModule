<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010409"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zack Engine · Maps</title>
<script>try{var s=JSON.parse(localStorage.getItem('zack.settings')||'{}');if(s.theme)document.documentElement.dataset.theme=s.theme;if(s.fz)document.documentElement.style.fontSize=s.fz+'px'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="zack.css">
</head>
<body data-page="maps">
<main id="app">
<section class="win">
<div class="wt"><b>Maps</b><span class="sm" style="opacity:.85">2D map and 3D globe · 241 countries · about 4,500 states and provinces · real Natural Earth data</span></div>
<div id="tPlanet" class="box">
  <div class="ttl"><span>Planet · Maps // <b id="pmMode" style="color:var(--c)">3D</b></span>
    <span class="flex flex-wrap gap-1 items-center"><input id="pmQ" placeholder="Botoșani, Tokyo, Japan, 47.7,26.6" class="sm bg-black px-1" style="border:1px solid var(--c);color:var(--c);outline:none;width:14rem;max-width:42vw"><button class="b" onclick="pmSearch()">GO</button><select id="mpC" onchange="mpPickC(this.value)" style="max-width:11rem"><option value="">Country…</option></select><select id="mpS" onchange="mpPickS(this.value)" style="max-width:11rem"><option value="">State / province…</option></select><button class="b" onclick="pm.showS=!pm.showS;pm.dirty=true">STATES</button><button class="b" onclick="pm.focus=!pm.focus;pm.dirty=true">FOCUS</button><button class="b" onclick="resetMap()">WORLD</button><button class="b" onclick="pm.mode='2D';pm.dirty=true">2D MAP</button><button class="b" onclick="pm.mode='3D'">3D GLOBE</button><button class="b" onclick="pm.spin=!pm.spin">SPIN</button><button class="b" onclick="zoomBy(1.6)">+</button><button class="b" onclick="zoomBy(1/1.6)">−</button><a id="gmLink" target="_blank" rel="noopener" style="padding:.25rem .7rem;border:1px solid var(--c);color:var(--c);font-size:.7rem" href="https://www.google.com/maps">GOOGLE MAPS</a></span></div>
  <canvas id="pmC" class="w-full" style="height:64vh;background:#000;touch-action:none;cursor:grab"></canvas>
  <div id="pmInfo" class="sm mt-1" style="opacity:.85"></div>
</div>
</section>
</main>
<script src="geo.js"></script>
<script src="zack.js"></script>
<script src="maps.js"></script>
</body>
</html>
