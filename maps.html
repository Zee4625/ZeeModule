<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010409"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zack Engine · Maps</title>
<script>try{var s=JSON.parse(localStorage.getItem('zack.settings')||'{}');if(s.theme)document.documentElement.dataset.theme=s.theme;if(s.fz)document.documentElement.style.fontSize=s.fz+'px'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="zack.css">
</head>
<body data-page="maps" data-secret="1">
<main id="app">
<section class="win">
<div class="wt"><b>Maps</b><span class="sm" style="opacity:.85">2D map and 3D globe · 241 countries · about 4,500 states and provinces · real Natural Earth data</span></div>
<div id="tPlanet" class="box">
  <div class="ttl"><span>Planet · Maps // <b id="pmMode" style="color:var(--c)">3D</b></span>
    <span class="flex flex-wrap gap-1 items-center"><input id="pmQ" placeholder="Botoșani, Tokyo, Japan, 47.7,26.6" class="sm bg-black px-1" style="border:1px solid var(--c);color:var(--c);outline:none;width:14rem;max-width:42vw"><button class="b" onclick="pmSearch()">GO</button><select id="mpC" onchange="mpPickC(this.value)" style="max-width:11rem"><option value="">Country…</option></select><select id="mpS" onchange="mpPickS(this.value)" style="max-width:11rem"><option value="">State / province…</option></select><button class="b" onclick="pm.showS=!pm.showS;pm.dirty=true">STATES</button><button class="b" onclick="pm.focus=!pm.focus;pm.dirty=true">FOCUS</button><button class="b" onclick="resetMap()">WORLD</button><button class="b" onclick="pm.mode='2D';pm.dirty=true">2D MAP</button><button class="b" onclick="pm.mode='3D'">3D GLOBE</button><button class="b" onclick="pm.spin=!pm.spin">SPIN</button><button class="b" onclick="zoomBy(1.6)">+</button><button class="b" onclick="zoomBy(1/1.6)">−</button><button class="b" id="camBtn" onclick="camToggle()">GLOBAL CAMERAS</button></span></div>
  <div id="mapWrap"><div id="mapMain"><canvas id="pmC" class="w-full" style="height:var(--mh,64vh);background:#000;touch-action:none;cursor:grab"></canvas>
  <div id="pmInfo" class="sm mt-1" style="opacity:.85"></div></div>
  <div id="camPanel" style="display:none;flex-direction:column;gap:.5rem">
    <div class="box"><div class="ttl"><span>Global cameras</span><span id="camCount" style="color:var(--c)"></span></div>
      <div class="flex flex-wrap items-center gap-2 mb-1"><input id="camQ" placeholder="search a camera, city or country" style="flex:1;min-width:8rem" autocomplete="off"><label class="sm"><input type="checkbox" id="camLive"> live only</label></div>
      <div class="flex flex-wrap gap-2 mb-1"><button class="b" id="camTour">TOUR</button><button class="b" id="camWorld">WORLD</button></div>
      <div class="sm mb-1" style="opacity:.9"><span style="color:var(--y)">&#9679;</span> country &nbsp;<span style="color:var(--g)">&#9632;</span> live &nbsp;<span style="color:var(--c)">&#9632;</span> still &nbsp;<span style="color:#fff">&#9679;</span> town</div>
      <div id="camList" class="sm" style="max-height:34vh;overflow:auto"></div></div>
    <div class="box"><div class="ttl"><span>Camera</span><span id="camSt" style="color:var(--c)">--</span></div><div id="camView" class="sm">Pick a country or a camera on the map or in the list.</div></div>
  </div></div>
</div>
</section>
</main>
<script src="zack.js"></script>
<script>Zack.load(['geo.js','cams.js','maps.js'])</script>
</body>
</html>
