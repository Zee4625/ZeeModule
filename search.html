<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010409"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zack Engine · Z.Engine</title>
<script>try{var s=JSON.parse(localStorage.getItem('zack.settings')||'{}');if(s.theme)document.documentElement.dataset.theme=s.theme;if(s.fz)document.documentElement.style.fontSize=s.fz+'px'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="zack.css">
</head>
<body data-page="search">
<main id="app">
<section class="win">
<div class="wt"><b>Z.Engine</b><span class="sm" style="opacity:.85"></span></div>
<div class="sbar"><span class="zlogo2">Z<b>.</b>Engine</span><form id="sf" class="hform" style="flex:1;width:auto" autocomplete="off"><input id="q" placeholder="Search" aria-label="Search" autocomplete="off"><button class="b" type="submit">SEARCH</button></form></div>
<div id="sug" class="sug" style="display:none"></div>
<div id="home"><div id="hist"></div></div>
<div id="res" style="display:none"><div id="tabs" class="flex flex-wrap gap-1 mb-1"></div><div id="out"></div></div>
<div class="box mt-2" id="keyBox" style="display:none"><div class="ttl"><span>Web search API key</span></div>
 <div class="flex flex-wrap gap-2 mt-1"><input id="kKey" placeholder="API key" style="flex:1;min-width:10rem" autocomplete="off"><input id="kCx" placeholder="Engine ID (cx)" style="flex:1;min-width:10rem" autocomplete="off"><button class="b" id="kSave">SAVE</button><button class="b k" id="kClear">REMOVE</button></div></div>
<div id="lb" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);align-items:center;justify-content:center;flex-direction:column;gap:.5rem;padding:.5rem"><img id="lbImg" alt="" style="max-width:96%;max-height:78vh"><div id="lbCap" class="sm"></div><button class="b" id="lbX">CLOSE</button></div>
</section>
</main>
<script src="zack.js"></script>
<script>Zack.load(['search.js'])</script>
</body>
</html>
