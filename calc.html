<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010409"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zack Engine · Calculator</title>
<script>try{var s=JSON.parse(localStorage.getItem('zack.settings')||'{}');if(s.theme)document.documentElement.dataset.theme=s.theme;if(s.fz)document.documentElement.style.fontSize=s.fz+'px'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="zack.css">
</head>
<body data-page="calc">
<main id="app">
<section class="win">
<div class="wt"><b>Calculator</b><span class="sm" style="opacity:.85"></span></div>
<div class="box" style="max-width:24rem;margin:0 auto"><input id="disp" class="disp" placeholder="0" autocomplete="off"><div id="err" class="sm" style="color:var(--r);min-height:1.2rem"></div><div id="kp" class="kp"></div><div class="sm mt-2" style="opacity:.8">History</div><div id="hist" class="sm"></div></div></section>
</main>
<script src="zack.js"></script>
<script>Zack.load(['calc.js'])</script>
</body>
</html>
