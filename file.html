<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010409"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zack Engine · Files</title>
<script>try{var s=JSON.parse(localStorage.getItem('zack.settings')||'{}');if(s.theme)document.documentElement.dataset.theme=s.theme;if(s.fz)document.documentElement.style.fontSize=s.fz+'px'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="zack.css">
</head>
<body data-page="file">
<main id="app">
<section class="win">
<div class="wt"><b>Files</b><span class="sm" style="opacity:.85">real file scan · read inside your browser · nothing is uploaded</span></div>
<div class="box"><div class="ttl"><span>File Scan</span><span id="scSt" style="color:var(--c)">NOT SCANNED</span></div>
  <div class="flex flex-wrap gap-2"><button class="b" onclick="scanDir()">SCAN FOLDER</button><button class="b" onclick="$('scIn2').click()">SCAN FILES</button><button class="b k" id="scCancel" onclick="scanCancel()" style="display:none">CANCEL</button><button class="b" onclick="scanClear()">CLEAR</button></div>
  <div id="scProg" class="bar mt-2" style="display:none"><i id="scProgI" style="width:0"></i></div>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-2"><div id="scSum" class="sm flex flex-col gap-1"></div><div id="scBars" class="sm flex flex-col gap-1"></div><div id="scTop" class="sm flex flex-col gap-1"></div></div>
  <div class="sm mt-2" style="opacity:.85">SCAN FOLDER needs Chrome or Edge on desktop; other browsers use the folder or file picker. The summary is saved so the Dashboard can show it.</div>
  <input id="scIn" type="file" webkitdirectory multiple hidden><input id="scIn2" type="file" multiple hidden></div>
<div class="box mt-2"><div class="ttl"><span>Browse and inspect</span><span id="fdSt" style="color:var(--c)">--</span></div>
  <div class="flex flex-wrap gap-2 items-center">
    <input id="fdQ" placeholder="filter by name..." oninput="fdRender()" style="min-width:10rem;flex:1">
    <select id="fdCat" onchange="fdRender()"><option value="">all types</option><option>Images</option><option>Video</option><option>Audio</option><option>Documents</option><option>Code</option><option>Archives</option><option>Programs</option><option>Other</option></select>
    <select id="fdSort" onchange="fdRender()"><option value="size">largest first</option><option value="new">newest first</option><option value="old">oldest first</option><option value="name">name</option><option value="dups">duplicates</option></select></div>
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-2 mt-2"><div class="lg:col-span-7"><div id="fdList" class="sm" style="max-height:60vh;overflow:auto"></div></div>
    <div class="lg:col-span-5"><div class="ttl"><span>Inspect</span></div><div id="fdDet" class="sm flex flex-col gap-1">Select a file from the list.</div><canvas id="fdPrev" style="display:none;max-width:100%;margin-top:.5rem"></canvas><pre id="fdTxt" class="sm" style="display:none;white-space:pre-wrap;word-break:break-all;margin-top:.5rem;max-height:30vh;overflow:auto"></pre></div></div></div>
</section>
</main>
<script src="zack.js"></script>
<script src="file.js"></script>
</body>
</html>
