<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010409"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zack Engine · Clock</title>
<script>try{var s=JSON.parse(localStorage.getItem('zack.settings')||'{}');if(s.theme)document.documentElement.dataset.theme=s.theme;if(s.fz)document.documentElement.style.fontSize=s.fz+'px'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="zack.css">
</head>
<body data-page="clock">
<main id="app">
<section class="win">
<div class="wt"><b>Clock</b><span class="sm" style="opacity:.85">world clocks, stopwatch, timer</span></div>
<div class="box"><div class="ttl"><span>World clocks</span></div><div id="wl" class="grid grid-cols-2 md:grid-cols-3 gap-2"></div><div class="flex flex-wrap gap-2 mt-2"><input id="tzIn" list="tzl" placeholder="add a time zone, e.g. Asia/Dubai" style="flex:1;min-width:10rem"><datalist id="tzl"></datalist><button class="b" id="tzAdd">ADD</button></div></div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2"><div class="box"><div class="ttl"><span>Stopwatch</span></div><div id="swOut" class="big">00:00.00</div><div class="flex gap-2 mt-1"><button class="b" id="swGo">START</button><button class="b" id="swReset">RESET</button></div></div>
<div class="box"><div class="ttl"><span>Timer</span></div><div id="tmOut" class="big">00:00</div><div class="flex flex-wrap gap-2 mt-1 items-center"><input id="tmMin" type="number" min="0" value="5" style="width:4.5rem"><span class="sm">min</span><input id="tmSec" type="number" min="0" max="59" value="0" style="width:4.5rem"><span class="sm">sec</span><button class="b" id="tmGo">START</button><button class="b" id="tmReset">RESET</button></div></div></div></section>
</main>
<script src="zack.js"></script>
<script>Zack.load(['clock.js'])</script>
</body>
</html>
