<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010409"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zack Engine · Z.Engine AI</title>
<script>try{var s=JSON.parse(localStorage.getItem('zack.settings')||'{}');if(s.theme)document.documentElement.dataset.theme=s.theme;if(s.fz)document.documentElement.style.fontSize=s.fz+'px'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="zack.css">
</head>
<body data-page="engineai" data-secret="1">
<main id="app">
<section class="win">
<div class="wt"><b>Z.Engine AI</b><span class="sm" id="aiSub" style="opacity:.85"></span></div>
<div class="aiWrap">
  <div class="box aiHead"><span id="aiStat" class="sm"></span><span class="grow"></span><button class="b" id="aiNew">NEW CHAT</button><button class="b" id="aiExp">EXPORT</button><button class="b" id="aiCfg">SETTINGS</button></div>
  <div id="cfgBox" class="box" style="display:none"><div class="ttl"><span>Model settings</span></div>
 <div class="srow"><span>Provider</span><select id="cProv"><option value="free">Free model (no key)</option><option value="anthropic">Anthropic (your API key)</option><option value="openai">OpenAI-compatible (your API key)</option></select></div>
 <div class="srow"><span>Model</span><input id="cModel" placeholder="e.g. claude-sonnet-5-5 / gpt-4o / openai-large" style="min-width:14rem;flex:1"></div>
 <div class="srow"><span>API key</span><input id="cKey" type="password" placeholder="kept only in this browser" autocomplete="off" style="min-width:14rem;flex:1"></div>
 <div class="srow"><span>Base URL (OpenAI-compatible)</span><input id="cBase" placeholder="https://api.openai.com/v1" style="min-width:14rem;flex:1"></div>
 <div class="srow" style="align-items:flex-start"><span>System prompt</span><textarea id="cSys" rows="3" placeholder="optional" style="min-width:14rem;flex:1"></textarea></div>
 <div class="flex gap-2 mt-1"><button class="b" id="cSave">SAVE</button><span class="sm" style="opacity:.85">Without a key it uses a free large model. With your own key it can use the strongest models. No message limit in this app.</span></div></div>
  <div id="chat" class="aiChat"></div>
  <div class="aiIn"><textarea id="aiIn" rows="2" placeholder="Write a message ..." aria-label="Message"></textarea><button class="b" id="aiSend">SEND</button></div>
</div></section>
</main>
<script src="zack.js"></script>
<script>Zack.load(['ai.js'])</script>
</body>
</html>
