<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010409"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zack Engine · Notes</title>
<script>try{var s=JSON.parse(localStorage.getItem('zack.settings')||'{}');if(s.theme)document.documentElement.dataset.theme=s.theme;if(s.fz)document.documentElement.style.fontSize=s.fz+'px'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="zack.css">
</head>
<body data-page="notes">
<main id="app">
<section class="win">
<div class="wt"><b>Notes</b><span class="sm" style="opacity:.85">saved in this browser</span></div>
<div class="grid grid-cols-1 md:grid-cols-12 gap-2"><div class="md:col-span-4 box"><div class="flex gap-2 mb-1"><input id="nq" placeholder="search notes" style="flex:1;min-width:0"><button class="b" id="nnew">NEW</button></div><div id="nlist" class="sm" style="max-height:55vh;overflow:auto"></div></div>
<div class="md:col-span-8 box"><input id="ntitle" placeholder="Title" style="width:100%;margin-bottom:.4rem"><textarea id="nbody" rows="16" placeholder="Write here ..."></textarea><div class="flex justify-between mt-1"><span id="ncount" class="sm" style="opacity:.8"></span><button class="b k" id="ndel">DELETE</button></div></div></div></section>
</main>
<script src="zack.js"></script>
<script>Zack.load(['notes.js'])</script>
</body>
</html>
