<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010409"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zack Engine · Network</title>
<script>try{var s=JSON.parse(localStorage.getItem('zack.settings')||'{}');if(s.theme)document.documentElement.dataset.theme=s.theme;if(s.fz)document.documentElement.style.fontSize=s.fz+'px'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="zack.css">
</head>
<body data-page="net" data-secret="1">
<main id="app">
<section class="win">
<div class="wt"><b>PC &amp; Network</b><span class="sm" style="opacity:.85">your device and your connection · measured live in the browser</span></div>
<div id="tNet" class="grid grid-cols-1 lg:grid-cols-12 gap-2">
  <div class="lg:col-span-6 box"><div class="ttl"><span>PC Info</span><span id="pcBat" style="color:var(--c)"></span></div><div id="pcT" class="sm flex flex-col gap-1"></div></div>
  <div class="lg:col-span-6 box"><div class="ttl"><span>Network Quality</span><span id="nqLabel" style="color:var(--c)">TESTING</span></div>
    <div class="flex items-end justify-between"><div><div class="sm">CONNECTION SCORE</div><div id="nqScore" class="text-4xl font-bold glow">--</div></div><div class="sm text-right">PING <b id="nqAvg">--</b><br>JITTER <b id="nqJit">--</b><br>LOSS <b id="nqLoss">--</b></div></div>
    <canvas id="nqC" class="w-full mt-2 bg-black rounded" style="height:90px;border:1px solid rgba(var(--gr),.3)"></canvas>
    <div id="nqRows" class="sm mt-2 flex flex-col gap-1"></div>
    <div class="flex items-center gap-2 mt-2"><button class="b" id="spBtn" onclick="speedTest()">SPEED TEST</button><span id="spOut" class="sm"></span></div>
    <div class="sm mt-2" style="opacity:.75">Ping and speed are measured to the server hosting this page. Wi-Fi name and signal strength can't be read by web pages.</div></div>
</div>
</section>
</main>
<script src="zack.js"></script>
<script>Zack.load(['net.js'])</script>
</body>
</html>
